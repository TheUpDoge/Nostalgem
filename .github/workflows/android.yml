name: Android TV app

on:
  push:
    branches: [main]
    paths: ["web/**", "android-tv/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["web/**", "android-tv/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with the APK (a stable download link for your TV)"
        type: boolean
        default: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK (bundles web/ inside it)
        run: gradle --no-daemon -p android-tv assembleRelease
      - name: Name it
        run: cp android-tv/app/build/outputs/apk/release/app-release.apk nostalgem.apk && ls -l nostalgem.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nostalgem-apk
          path: nostalgem.apk
      # Actions → Android TV app → Run workflow publishes a release, so this link always has the newest APK:
      #   https://github.com/<owner>/<repo>/releases/latest/download/nostalgem.apk
      - name: Publish a release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: NostalGem 1.0.${{ github.run_number }}
          make_latest: true
          files: nostalgem.apk
          body: |
            The TV app for Google TV, Android TV and Fire TV. Install it with the Downloader app; see "Put it on your TV" in the README.
