name: Web app

on:
  push:
    branches: [main]
    paths: ["web/**", "tests/**", "tools/**", "package.json", "package-lock.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "tests/**", "tools/**", "package.json", "package-lock.json", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Schedule, remote, Archive, subtitle, lineup and TV-browser syntax tests
        run: npm test
      - name: Install a browser for the smoke test, and PeerJS's server for the phone link test
        run: npm install --no-save playwright@1.63.0 peer@1.0.2 && npx playwright install --with-deps chromium
      - name: Browser smoke test (remote control, guide, menu, radio, outage, phone and TV sizes)
        run: npm run test:browser
      - name: Phone remote over real WebRTC on a home-style network (local broker)
        run: npm run test:lan
      - name: Phone remote through the relay, with WebRTC blocked (local message broker)
        run: npm run test:relay
      - name: Touch screens, a phone held sideways (dock, dragging the menu and guide, swipes)
        run: npm run test:touch
      - name: Inside the TV app, with a stand-in for the app (link-out stations open on the TV)
        run: npm run test:tvapp
      - name: Stations with their own picture and sound (666 slow and red, 111 stained glass and church echo)
        run: npm run test:stations
      - name: Clean cuts (card live, skip on a tape), the Reading Room's catalog shelves, and packs in a .zip
        run: npm run test:cuts
      - name: The phone's Mouse page (pointer, keys, typing) and packs sent from the phone, in a browser, the TV app and through the relay
        run: npm run test:mouse
      - name: Screen shape, 4:3 for old CRT TVs (everything inside the box, nothing stretched)
        run: npm run test:screen
      - name: The TV path's limits on the filters (ASCII, glass, light SVG looks), and a computer left as it is
        run: npm run test:tvlimits
      - name: Station cards in the channel family's look (a western's break, a horror channel's, and the card while a channel loads)
        run: npm run test:cards

  # Publishes web/ to GitHub Pages from main. One-time setup: Settings → Pages → Source: GitHub Actions.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
