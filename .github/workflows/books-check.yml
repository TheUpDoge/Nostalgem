name: Reading Room check

# Runs the Reading Room against the real Internet Archive on a GitHub runner (real internet): every shelf
# finds books, page lists and page images load in a browser, and the app borrows and shows real pages.
# "local" tests this checkout's web/ folder; a URL tests a published copy.

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site to test (local, or a URL)"
        default: "local"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node tests/live-books.mjs "${{ github.event.inputs.site }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-room-screens
          path: live-*.png
          if-no-files-found: ignore
