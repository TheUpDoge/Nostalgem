name: Live Archive check

# Runs the app against the real Internet Archive on a GitHub runner (real internet).
#   Reading Room: every shelf finds books, page lists and page images load in a browser, and the app
#   borrows and shows real pages.
#   Secret stations: every film on 069, 666 and 111 plays, 111's with CORS for the church sound, and in the
#   app 111's sound goes to church and 666 plays slow and low.
#   Send to TV: a real film sent from the phone plays and the phone's bar moves through it; YouTube's real
#   player gives a video's title and a playlist's videos (reported only: YouTube may turn a runner away).
# "local" tests this checkout's web/ folder; a URL tests a published copy.

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site to test (local, or a URL)"
        default: "local"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Reading Room
        run: node tests/live-books.mjs "${{ github.event.inputs.site }}"
      - name: Secret stations (films, church sound, slow and low)
        if: always()
        run: node tests/live-stations.mjs "${{ github.event.inputs.site }}"
      - name: Send to TV (a real film from the phone and its bar, then YouTube's real player, reported)
        if: always()
        run: node tests/live-sendto.mjs "${{ github.event.inputs.site }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screens
          path: live-*.png
          if-no-files-found: ignore
