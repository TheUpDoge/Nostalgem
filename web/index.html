<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NostalGem</title>
    <meta name="description" content="Retro cable TV from the public domain: 24/7 channels of Westerns, serials, cartoons, noir, old-time radio and more, streamed from the Internet Archive." />
    <meta name="theme-color" content="#0d0221" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="icons/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />
    <meta property="og:title" content="NostalGem" />
    <meta property="og:description" content="Retro cable TV from the public domain: 24/7 channels of Westerns, serials, cartoons, noir, old-time radio and more, streamed from the Internet Archive." />
    <meta property="og:image" content="icons/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NostalGem" />
    <meta name="twitter:description" content="Retro cable TV from the public domain: 24/7 channels of Westerns, serials, cartoons, noir, old-time radio and more." />
    <meta name="twitter:image" content="icons/og-image.jpg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://archive.org" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <link rel="preload" href="fonts/orbitron-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/vt323-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="icons/boot-gem.webp" as="image" type="image/webp" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="tv" class="tv">
      <video id="screen" playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
      <div id="yt" class="yt" hidden></div>
      <div class="lookbd" aria-hidden="true"></div>
      <div id="radio" class="radio" hidden></div>
      <div id="card" class="card" hidden></div>
      <div id="cutcard" class="cutcard" hidden></div>
      <canvas id="static" class="static" aria-hidden="true"></canvas>
      <div class="lookfx" aria-hidden="true"></div>
      <div class="haunt" aria-hidden="true"></div>
      <div class="crt" aria-hidden="true"></div>
      <div id="bug" class="bug" hidden></div>
      <div id="osd" class="osd" aria-live="polite"><div class="osd-num"></div><div class="osd-name"></div></div>
      <div id="banner" class="banner" hidden></div>
      <div id="guide" class="guide" hidden></div>
      <div id="menu" class="menu" hidden></div>
      <div id="intro" class="intro" hidden></div>
      <div id="rewind" class="rewind" hidden></div>
      <div id="reader" class="reader" hidden></div>
      <div id="dialog" class="dialog" hidden></div>
      <div id="numpad" class="numpad" hidden></div>
      <div id="toast" class="toast" role="status" hidden></div>
      <!-- The phone's pointer (pointer.js), when this page draws it: in a browser, or an older TV app. -->
      <div id="pointer" class="pointer" hidden aria-hidden="true"><svg viewBox="0 0 24 32" width="24" height="32"><path d="M2 2v24l6.4-6.2 4.5 10.3 4.1-1.8-4.4-10H21z" /></svg></div>
      <div id="touch" class="touch" hidden>
        <div class="t-rocker" role="group" aria-label="Channel">
          <button type="button" data-act="chup" data-repeat aria-label="Channel up">▲</button>
          <span class="t-ch" aria-hidden="true">CH</span>
          <button type="button" data-act="chdown" data-repeat aria-label="Channel down">▼</button>
        </div>
        <div class="t-dock">
          <button type="button" data-act="guide">GUIDE</button>
          <button type="button" data-act="info">INFO</button>
          <button type="button" data-act="playpause" aria-label="Pause or resume">▶❚❚</button>
          <button type="button" data-act="numpad" aria-label="Number pad">123</button>
          <button type="button" data-act="menu">MENU</button>
          <button type="button" data-act="back">BACK</button>
        </div>
        <!-- With the guide or a menu open: a remote's arrows, OK and BACK (hold an arrow to keep going). -->
        <div class="t-dock t-navdock">
          <button type="button" data-act="up" data-repeat aria-label="Up">▲</button>
          <button type="button" data-act="down" data-repeat aria-label="Down">▼</button>
          <button type="button" data-act="left" data-repeat aria-label="Left">◀</button>
          <button type="button" data-act="right" data-repeat aria-label="Right">▶</button>
          <button type="button" data-act="ok">OK</button>
          <button type="button" data-act="back">BACK</button>
        </div>
      </div>
      <div id="boot" class="boot">
        <div class="boot-set">
          <div class="boot-glow" aria-hidden="true"></div>
          <div class="boot-crt">
            <img class="boot-gem" src="icons/boot-gem.webp" alt="" width="1120" height="958" />
            <div class="boot-tube" aria-hidden="true">
              <div class="boot-power"></div>
              <canvas id="boot-snow" class="boot-snow" width="160" height="90"></canvas>
              <div class="boot-bars"></div>
              <div class="boot-flash"></div>
              <div class="boot-bloom"></div>
              <div class="boot-beam"></div>
            </div>
            <div class="boot-glint" aria-hidden="true"></div>
            <div class="boot-scan" aria-hidden="true"></div>
          </div>
        </div>
        <div class="boot-titles">
          <div class="boot-spell" aria-label="Nostalgem">
            <span>N</span><span>O</span><span>S</span><span>T</span><span>A</span><span>L</span><span>G</span><span>E</span><span>M</span><i class="boot-caret" aria-hidden="true"></i>
          </div>
          <div class="boot-credit">Created by The UpDoge</div>
          <div class="boot-tag" aria-label="A Blast From The Past">
            <span class="boot-tag-c" aria-hidden="true">A Blast From The Past</span>
            <span class="boot-tag-m" aria-hidden="true">A Blast From The Past</span>
            <span class="boot-tag-y">A Blast From The Past</span>
          </div>
        </div>
        <div class="boot-wait"></div>
        <div class="boot-version"></div>
        <div class="boot-hint">ANY KEY OR TAP</div>
      </div>
    </div>
    <noscript><p style="color: #fff; padding: 2rem">NostalGem needs JavaScript turned on.</p></noscript>
  </body>
</html>
