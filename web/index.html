<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NostalGem</title>
    <meta name="description" content="Retro cable TV from the public domain: 24/7 channels of Westerns, serials, cartoons, noir, old-time radio and more, streamed from the Internet Archive." />
    <meta name="theme-color" content="#0d0221" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://archive.org" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <link rel="preload" href="fonts/orbitron-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/vt323-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="tv" class="tv">
      <video id="screen" playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
      <div id="yt" class="yt" hidden></div>
      <div class="lookbd" aria-hidden="true"></div>
      <div id="radio" class="radio" hidden></div>
      <div id="card" class="card" hidden></div>
      <canvas id="static" class="static" aria-hidden="true"></canvas>
      <div class="lookfx" aria-hidden="true"></div>
      <div class="crt" aria-hidden="true"></div>
      <div id="bug" class="bug" hidden></div>
      <div id="osd" class="osd" aria-live="polite"><div class="osd-num"></div><div class="osd-name"></div></div>
      <div id="banner" class="banner" hidden></div>
      <div id="guide" class="guide" hidden></div>
      <div id="menu" class="menu" hidden></div>
      <div id="dialog" class="dialog" hidden></div>
      <div id="numpad" class="numpad" hidden></div>
      <div id="toast" class="toast" role="status" hidden></div>
      <div id="touch" class="touch" hidden>
        <button type="button" data-act="chup" aria-label="Channel up">CH ▲</button>
        <button type="button" data-act="chdown" aria-label="Channel down">CH ▼</button>
        <button type="button" data-act="guide">GUIDE</button>
        <button type="button" data-act="info">INFO</button>
        <button type="button" data-act="playpause" aria-label="Pause or resume">⏯</button>
        <button type="button" data-act="menu">MENU</button>
        <button type="button" data-act="back">BACK</button>
      </div>
      <div id="boot" class="boot">
        <div class="boot-lockup">
          <div class="logo">NOSTAL<span class="gem">GEM</span></div>
          <div class="logo-tv">TV</div>
          <div class="boot-status blink">TUNING IN…</div>
        </div>
      </div>
    </div>
    <noscript><p style="color: #fff; padding: 2rem">NostalGem needs JavaScript turned on.</p></noscript>
  </body>
</html>
